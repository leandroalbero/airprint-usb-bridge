# airprint-usb-bridge configuration: one "key = value" per line. Keys are the
# command-line flag names without dashes; a flag given on the command line overrides
# the file. Install as /etc/airprint-usb-bridge/airprint-usb-bridge.conf for
# packaging/airprint-usb-bridge.service.

# Name shown on iPhones and Macs (default: the printer's make and model).
#name = Label Printer
#location = Office

# IPP and IPPS share one port. 8631 avoids CUPS (631) and needs no root.
#port = 8631

# auto uses the first USB printer (narrowed by match, "MFG:MDL" substrings); or a
# /dev/usb/lpN path; or tcp://printer-address:9100 for a network printer.
# "airprint-usb-bridge list-printers" shows the USB printers and their device IDs.
#device = auto
#match = Brother:QL

# auto picks the driver from the printer's IEEE 1284 device ID; or one of brother-ql,
# pcl, postscript, cups, dymo, zpl. "airprint-usb-bridge drivers" lists them with
# their media ids and settings.
#driver = auto
# Driver settings, key=value; repeat the line for more than one, e.g. for pcl:
#driver-opt = duplex=true
#driver-opt = dpi=300,600

# The cups driver needs the printer's PPD; its filter must be installed.
#ppd = /usr/share/ppd/example/printer.ppd

# Media id, listed per driver (brother-ql: roll width in mm, default 62; pcl and
# postscript: a4, letter, ...; dymo: 99012, ...; zpl: 4x6, ...).
#media = 62

# brother-ql settings. profile defaults to the printer's model; built-in profiles:
# ql500 ql550 ql560 ql570 ql580n ql650td ql700 ql710w ql720nw ql800 ql810w
# ql820nwb ql1050 ql1060n ql1100 ql1110nwb (only ql700 is verified on hardware).
#profile = ql700

# roll: only the continuous roll is "loaded" (recommended).
# roll+presets: the preset lengths are loaded too, so iOS shows a paper menu.
#media-policy = roll
#presets = 29,50

# Blank rows removed from each end of a label: max (no limit) or a row count.
#trim = max
#dither = auto

# Offer print-quality high where the driver can (brother-ql: 300x600 dpi along the feed).
#high-res = false

# auto uses avahi-daemon when it is running, otherwise a built-in responder.
#mdns = auto

# How often to ask the printer for its status while idle; 0 never asks.
#status-interval = 30s

# Keep each job's input document and rendered images here (for troubleshooting).
#debug-dir = /var/lib/airprint-usb-bridge/debug

# Write encoded jobs to this directory instead of printing.
#dry-run = /var/lib/airprint-usb-bridge/dry-run
