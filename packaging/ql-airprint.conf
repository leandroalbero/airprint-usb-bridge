# ql-airprint configuration: one "key = value" per line. Keys are the command-line
# flag names without dashes; a flag given on the command line overrides the file.
# Install as /etc/ql-airprint/ql-airprint.conf for packaging/ql-airprint.service.

# Name shown on iPhones and Macs (default "Brother <model>").
#name = Label Printer
#location = Office

# IPP and IPPS share one port. 8631 avoids CUPS (631) and needs no root.
#port = 8631

# auto finds the first /dev/usb/lp* that answers as the profile's model.
# Network models: tcp://printer-address:9100
#device = auto

#profile = ql700
#media = 62

# roll: only the continuous roll is "loaded" (recommended).
# roll+presets: the preset lengths are loaded too, so iOS shows a paper menu.
#media-policy = roll
#presets = 29,50

# Blank rows removed from each end of a label: max (no limit) or a row count.
#trim = max
#dither = auto

# Offer print-quality high (300x600 dpi along the feed).
#high-res = false

# auto uses avahi-daemon when it is running, otherwise a built-in responder.
#mdns = auto

# How often to ask the printer for its status while idle; 0 never asks.
#status-interval = 30s

# Keep each job's input document and label PNGs here (for troubleshooting).
#debug-dir = /var/lib/ql-airprint/debug

# Write encoded jobs to this directory instead of printing.
#dry-run = /var/lib/ql-airprint/dry-run
